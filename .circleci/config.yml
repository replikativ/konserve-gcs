version: 2.1

orbs:
  tools: replikativ/clj-tools@0

jobs:
  # Cheap, always-on gate: load the namespace against the PINNED konserve, with no
  # external service. A stale/incompatible konserve pin (e.g. one missing
  # PReadMissSafe, or one that dropped a transitive dep this ns relies on) fails
  # here immediately.
  smoke:
    docker:
      - image: clojure:temurin-21-tools-deps
    steps:
      - checkout
      - run:
          name: load namespace against pinned konserve
          command: clojure -M -e "(require 'konserve-gcs.core)(println :loaded)"

  # Reflection is a latency cost on the JVM and a correctness cost under
  # native-image, where a reflective call resolves at run time and so works
  # only if the target was registered when the image was built. Gate on our own
  # namespaces only -- a dependency's warnings are real but are not fixable
  # from here.
  reflection:
    docker:
      - image: clojure:temurin-21-tools-deps
    steps:
      - checkout
      - run:
          name: fail on reflective calls
          command: |
            NSES=$(find src -name '*.clj' -o -name '*.cljc' \
                     | sed 's|^src/||; s|\.cljc\?$||; s|/|.|g; s|_|-|g' \
                     | sort -u | sed "s/^/'/" | tr '\n' ' ')
            clojure -M -e "(set! *warn-on-reflection* true)(doseq [n [$NSES]] (require n))(println :loaded)" \
              > /tmp/refl.out 2> /tmp/refl.err || { cat /tmp/refl.err; exit 1; }
            if grep -q '^Reflection warning.*konserve_gcs/' /tmp/refl.err; then
              echo "Reflective calls in konserve-gcs sources:"
              grep '^Reflection warning.*konserve_gcs/' /tmp/refl.err
              echo
              echo "Add a type hint. Under native-image these fail at run time."
              exit 1
            fi
            echo "No reflective calls in konserve-gcs sources."

  # Emulator tests against a fake-gcs-server service container. On the docker
  # executor the secondary image is reachable on localhost:4443, matching the
  # tests' emulator-spec; the tests self-create the bucket.
  unittest:
    docker:
      - image: clojure:temurin-21-tools-deps
      - image: fsouza/fake-gcs-server
        command: -scheme http -port 4443
    steps:
      - checkout
      - run:
          name: wait for fake-gcs-server on :4443
          command: |
            for i in $(seq 1 60); do (echo > /dev/tcp/localhost/4443) 2>/dev/null && exit 0; sleep 1; done
            echo "fake-gcs-server did not come up on :4443"; exit 1
      - run:
          name: run emulator compliance tests
          command: |
            clojure -M:test -e "(require '[clojure.test :as t] 'konserve-gcs.emulator-test)(let [{:keys [fail error]} (t/run-tests 'konserve-gcs.emulator-test)](when (or (pos? fail) (pos? error)) (System/exit 1)))"

workflows:
  build-test-and-deploy:
    jobs:
      - tools/setup:
          context: docker-deploy
      - tools/build:
          context: docker-deploy
          requires:
            - tools/setup
      - tools/format:
          context: docker-deploy
          requires:
            - tools/setup
      - smoke
      - reflection
      - unittest
      - tools/deploy:
          context:
            - clojars-deploy
            - docker-deploy
          filters:
            branches:
              only: main
          requires:
            - tools/build
            - tools/format
            - smoke
            - unittest
      - tools/release:
          context:
            - github-token
            - docker-deploy
          filters:
            branches:
              only: main
          requires:
            - tools/deploy
